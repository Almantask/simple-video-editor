# Categories for GitHub's "Generate release notes" button and `gh release --generate-notes`.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Fixes
      labels:
        - bugfix
        - bug
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: CI / CD
      labels:
        - ci
        - cd
    - title: Other
      labels:
        - "*"
